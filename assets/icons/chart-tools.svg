<?xml version="1.0" encoding="UTF-8"?>
<!--
  TL 차트 도구막대 아이콘 스프라이트 (디자인팀, 2026-08-25)
  16px / 단색 / currentColor / stroke-width 1.5 / fill none
  그라디언트·그림자·이모지 없음. 전부 직접 그렸고 외부에서 받아온 그림이 없습니다.

  쓰는 법(권장) — assets/icons/chart-tools-symbols.html 을 index.html <body> 바로 뒤에
  한 번 붙여넣고, 버튼 안에서 <use href="#tlc-i-cursor"/> 로 부릅니다.
  외부 파일 참조는 브라우저마다 currentColor 상속이 달라 권장하지 않습니다.
  이 파일은 원본 보관·미리보기용입니다.
-->
